name: Test du moteur Coût rendu France

on:
  workflow_dispatch:

jobs:
  test-landed-cost-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Tester le moteur Coût rendu France
        run: npm run test:landed-cost
