name: Test du moteur Coût rendu France

on:
  push:
    branches:
      - main
      - v4-development
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  test-landed-cost:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Tester le moteur Coût rendu France
        run: node v4/engines/landed-cost-engine.test.js
