name: V4 Engine Tests

on:
  push:
    branches:
      - v4-development
  workflow_dispatch:

jobs:
  landed-cost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run landed cost tests
        run: node --test v4/engines/landed-cost-engine.test.js
