name: Deploy V4 E-commerce to GitHub Pages

on:
  push:
    branches:
      - main
      - v4-development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp app.js _site/app.js
          cp business-health.js _site/business-health.js
          cp -r v4 _site/v4
          if [ -f manifest.json ]; then cp manifest.json _site/manifest.json; fi
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          duplicate = '''    option.textContent =
      item.product +
      (item.sku ? " • " + item.sku : "") +
      " — " +
      item.qty +
      " disponibles";

    select.appendChild(option);

  });

}'''
          marker = duplicate + '\nfunction addCash()'
          if marker in s:
              s = s.replace(marker, 'function addCash()', 1)
          s = s.replace('</body>', '<script type="module" src="./app.js"></script></body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate published JavaScript modules
        run: |
          node --check _site/app.js
          node --check _site/v4/domain/rules.js
          node --check _site/v4/domain/diagnostics.js
          node --check _site/v4/state/store.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
