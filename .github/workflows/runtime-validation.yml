name: V4 Runtime Validation

on:
  workflow_dispatch:

jobs:
  validate-runtime-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate complete V4 suite
        run: npm test
