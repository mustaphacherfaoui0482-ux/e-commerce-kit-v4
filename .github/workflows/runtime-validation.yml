name: V4 Runtime Validation

on:
  push:
    branches:
      - main
      - v4-development
  pull_request:
    branches:
      - main
      - v4-development
  workflow_dispatch:

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate complete V4 suite
        run: npm test
