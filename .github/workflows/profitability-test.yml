name: V4 Profitability Tests

on:
  push:
    branches:
      - v4-development
  workflow_dispatch:

jobs:
  profitability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run profitability tests
        run: node --test v4/engines/profitability-engine.test.js
