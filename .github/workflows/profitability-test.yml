name: V4 Core Engine Tests

on:
  push:
    branches:
      - main
      - v4-development
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  test-core-engines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run complete V4 validation
        run: npm test
